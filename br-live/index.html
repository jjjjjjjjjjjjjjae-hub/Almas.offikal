<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALMAS OFFICAL • Friend Invite</title>
<style>
:root{color-scheme:dark;--bg:#07090f;--card:#121622;--p:#7c5cff;--mut:#9aa4ba}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 30% 0,#322276 0,transparent 36%),var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#fff}
.box{width:min(92vw,480px);padding:22px;border:1px solid #303650;border-radius:26px;background:rgba(18,22,34,.96);box-shadow:0 22px 70px #0009}
.logo{font-size:29px;font-weight:900}.sub{margin-top:4px;font-size:12px;letter-spacing:.08em;color:#c7bfff}.invite{margin:20px 0;padding:16px;border-radius:18px;background:#0b0e17}.who{font-size:20px;font-weight:800}.small{font-size:13px;color:var(--mut);margin-top:5px;line-height:1.45}
button{width:100%;height:54px;border:0;border-radius:16px;background:var(--p);color:#fff;font-size:16px;font-weight:900;cursor:pointer}
.note{margin-top:12px;text-align:center;font-size:12px;color:var(--mut)}
</style>
</head>
<body>
<div class="box">
  <div class="logo">ALMAS OFFICAL</div>
  <div class="sub">BLACK RUSSIA • DEVICE CONNECT</div>
  <div class="invite">
    <div class="who" id="who">Досқа шақыру</div>
    <div class="small" id="room">Қолданбаны ашу үшін төмендегі батырманы бас.</div>
  </div>
  <button id="open">Қолданбада ашу</button>
  <div class="note">Бұл GitHub.io беті тек құрылғыларды қолданбаға жалғайды. Экран/дауыс сайтта көрсетілмейді.</div>
</div>
<script>
const q=new URLSearchParams(location.search);
const invite=(q.get('invite')||'').trim();
const room=(q.get('room')||'').trim();
document.getElementById('who').textContent=invite?invite+' сені досқа шақырды':'ALMAS OFFICAL шақыруы';
document.getElementById('room').textContent=room?'Connection: '+room:'Қолданбаны ашу үшін төмендегі батырманы бас.';
function intentUrl(){
  const fb=encodeURIComponent(location.href);
  return 'intent://join?room='+encodeURIComponent(room)+'&friend='+encodeURIComponent(invite)+'#Intent;scheme=almasoffical;package=kz.almasofficial.br.universal;S.browser_fallback_url='+fb+';end';
}
function openApp(){ location.href=intentUrl(); }
document.getElementById('open').onclick=openApp;
// Android браузер рұқсат етсе, link ашылғанда қолданбаны бірден шақырамыз.
// Браузер сыртқы қолданбаны auto-open-нан қорғаса, үлкен батырма fallback болып қалады.
setTimeout(openApp,350);
</script>
</body>
</html>
