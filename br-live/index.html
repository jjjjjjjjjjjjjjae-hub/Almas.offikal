<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ALMAS OFFICAL • Connect</title>
<style>
:root{color-scheme:dark;--bg:#080a10;--card:#131722;--p:#7558ff;--mut:#98a1b5}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:white}
.card{width:min(92vw,430px);padding:24px;border-radius:24px;background:var(--card);border:1px solid #2c3242;text-align:center}
.logo{font-size:28px;font-weight:900}.sub{font-size:12px;color:#c8c1ff;margin-top:4px;letter-spacing:.08em}
.msg{margin:22px 0;font-size:16px;line-height:1.5}.mut{color:var(--mut);font-size:12px;margin-top:12px}
button{width:100%;height:54px;border:0;border-radius:16px;background:var(--p);color:white;font-size:16px;font-weight:900}
</style>
</head><body>
<div class="card">
  <div class="logo">ALMAS OFFICAL</div>
  <div class="sub">DEVICE BRIDGE</div>
  <div class="msg" id="msg">Құрылғыны қолданбаға қосу</div>
  <button id="open">Қолданбада ашу</button>
  <div class="mut">GitHub.io тек екі телефон арасындағы сілтемені қолданбаға өткізеді.</div>
</div>
<script>
const q=new URLSearchParams(location.search);
const fromId=(q.get('fromId')||'').trim();
const fromNick=(q.get('fromNick')||'').trim();
document.getElementById('msg').textContent=fromNick&&fromId
  ? fromNick+' ('+fromId+') сені қосылуға шақырды'
  : 'ALMAS OFFICAL қолданбасын ашу';
function intentUrl(){
  const fb=encodeURIComponent(location.href);
  return 'intent://connect?friendId='+encodeURIComponent(fromId)+'&friendNick='+encodeURIComponent(fromNick)
    +'#Intent;scheme=almasoffical;package=kz.almasofficial.br.universal;S.browser_fallback_url='+fb+';end';
}
function openApp(){location.href=intentUrl()}
document.getElementById('open').onclick=openApp;
setTimeout(openApp,300);
</script></body></html>
