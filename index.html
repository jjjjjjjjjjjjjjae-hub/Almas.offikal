<!doctype html>
<html lang="kk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#070b10">
<title>Almas Game 0</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070b10;font-family:system-ui,Arial,sans-serif;touch-action:none}
#game{position:fixed;inset:0}canvas{display:block;width:100%;height:100%}
#loading{position:fixed;inset:0;display:grid;place-items:center;z-index:5;background:#070b10;color:#fff;text-align:center}
#loading.hide{display:none}#loading b{display:block;font-size:25px;margin-bottom:8px}#loading span{color:#aeb8c6;font-size:14px}
#dualPanel{position:fixed;left:12px;top:12px;z-index:20;width:min(330px,calc(100vw - 24px));padding:12px;border-radius:16px;background:rgba(7,11,16,.82);backdrop-filter:blur(12px);color:#fff;box-sizing:border-box;box-shadow:0 10px 35px rgba(0,0,0,.32)}
#dualPanel h3{margin:0 0 9px;font-size:15px}#dualPanel .row{display:flex;gap:8px;margin-bottom:8px}#dualPanel button{flex:1;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:#fff;padding:9px 10px;border-radius:11px;font-weight:700}#dualPanel button.active{background:#fff;color:#0b1118}
.fileBtn{display:block;margin-top:7px;padding:9px 10px;border:1px dashed rgba(255,255,255,.25);border-radius:11px;font-size:12px;color:#dfe7ef;cursor:pointer}.fileBtn input{display:none}#status{display:block;margin-top:9px;color:#9fb0bf;font-size:11px;line-height:1.35}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"}}</script>
</head>
<body>
<div id="game"></div>
<div id="loading"><div><b>ALMAS GAME 0</b><span id="txt">Сахна жүктелуде…</span></div></div>
<div id="dualPanel">
<h3>FPP / TPP сынақ режимі</h3>
<div class="row"><button id="fppBtn">FPP</button><button id="tppBtn" class="active">TPP</button></div>
<label class="fileBtn">TPP толық кейіпкер (.glb/.gltf)<input id="tppFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label>
<label class="fileBtn">FPP екі қол / білек (.glb/.gltf)<input id="fppFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label>
<label class="fileBtn">Қару / пышақ (.glb/.gltf)<input id="weaponFile" type="file" accept=".glb,.gltf,model/gltf-binary,model/gltf+json"></label>
<span id="status">TPP: толық модель қарсыласқа көрінеді. FPP: камераға тек қол/білек + қару шығады.</span>
</div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
const root=document.querySelector('#game'),loading=document.querySelector('#loading'),txt=document.querySelector('#txt'),status=document.querySelector('#status');
const scene=new THREE.Scene();scene.background=new THREE.Color(0x9ab0c1);
const camera=new THREE.PerspectiveCamera(58,innerWidth/innerHeight,.01,10000);camera.position.set(2,1.3,2);scene.add(camera);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;root.appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.dampingFactor=.06;
scene.add(new THREE.HemisphereLight(0xe7f2ff,0x38404b,2.2));const sun=new THREE.DirectionalLight(0xffffff,3);sun.position.set(4,7,3);sun.castShadow=true;scene.add(sun);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(20,20),new THREE.MeshStandardMaterial({color:0x58636c,roughness:1}));ground.rotation.x=-Math.PI/2;ground.receiveShadow=true;scene.add(ground);
const loader=new GLTFLoader();let map=null,tpp=null,fpp=null,weaponSource=null,tppWeapon=null,fppWeapon=null,mode='TPP';
const fppRoot=new THREE.Group();fppRoot.name='FPP_ViewModel';fppRoot.position.set(.18,-.42,-.82);camera.add(fppRoot);fppRoot.visible=false;
function setShadows(o){o.traverse(n=>{if(n.isMesh){n.castShadow=true;n.receiveShadow=true;n.frustumCulled=false}})}
function bbox(o){o.updateWorldMatrix(true,true);return new THREE.Box3().setFromObject(o)}
function autoScale(o,targetHeight=1.8){const s=bbox(o).getSize(new THREE.Vector3());if(s.y>0){o.scale.multiplyScalar(targetHeight/s.y);o.updateMatrixWorld(true)}}
function centerOnGround(o){let b=bbox(o),c=b.getCenter(new THREE.Vector3());o.position.x-=c.x;o.position.z-=c.z;o.updateMatrixWorld(true);o.position.y-=bbox(o).min.y;o.updateMatrixWorld(true)}
function frame(o){const b=bbox(o),s=b.getSize(new THREE.Vector3()),c=b.getCenter(new THREE.Vector3()),m=Math.max(s.x,s.y,s.z)||1,d=m/(2*Math.tan(THREE.MathUtils.degToRad(camera.fov)/2))*1.8;camera.position.set(c.x+d*.65,c.y+d*.38,c.z+d);controls.target.copy(c);controls.update()}
function disposeObject(o){if(!o)return;o.removeFromParent()}
function findRightHand(root){const keys=['righthand','right_hand','hand_r','mixamorigrighthand','r_hand'];let hit=null;root.traverse(o=>{if(hit)return;const n=(o.name||'').toLowerCase();if(keys.some(k=>n.includes(k)))hit=o});return hit}
function clearWeapons(){if(tppWeapon){tppWeapon.removeFromParent();tppWeapon=null}if(fppWeapon){fppWeapon.removeFromParent();fppWeapon=null}}
function attachWeapons(){clearWeapons();if(!weaponSource)return;if(tpp){tppWeapon=weaponSource.clone(true);(findRightHand(tpp)||tpp).add(tppWeapon);tppWeapon.position.set(0,0,0);tppWeapon.rotation.set(0,0,0)}if(fpp){fppWeapon=weaponSource.clone(true);fppRoot.add(fppWeapon);fppWeapon.position.set(.08,-.05,-.32);fppWeapon.rotation.set(0,0,0)}}
function setMode(next){mode=next;const isFPP=mode==='FPP';if(tpp)tpp.visible=!isFPP;fppRoot.visible=isFPP;controls.enabled=!isFPP;document.querySelector('#fppBtn').classList.toggle('active',isFPP);document.querySelector('#tppBtn').classList.toggle('active',!isFPP);status.textContent=isFPP?'FPP қосылды: жергілікті ойыншыға тек қол/білек + қару көрінеді.':'TPP қосылды: қарсыласқа толық кейіпкер + қару көрінеді.';if(!isFPP&&tpp)frame(tpp)}
async function loadLocal(file){const url=URL.createObjectURL(file);try{return await loader.loadAsync(url)}finally{setTimeout(()=>URL.revokeObjectURL(url),1000)}}
async function loadTPP(file){const gltf=await loadLocal(file);if(tpp)disposeObject(tpp);tpp=gltf.scene;tpp.name='TPP_Player';setShadows(tpp);autoScale(tpp,1.8);centerOnGround(tpp);scene.add(tpp);attachWeapons();setMode(mode);if(mode==='TPP')frame(tpp);status.textContent=`TPP дайын: ${file.name}${gltf.animations?.length?` • ${gltf.animations.length} animation`:''}`}
async function loadFPP(file){const gltf=await loadLocal(file);if(fpp)disposeObject(fpp);fpp=gltf.scene;fpp.name='FPP_Arms';setShadows(fpp);autoScale(fpp,.72);fpp.position.set(0,0,0);fpp.rotation.set(0,0,0);fppRoot.add(fpp);attachWeapons();setMode(mode);status.textContent=`FPP дайын: ${file.name}${gltf.animations?.length?` • ${gltf.animations.length} animation`:''}`}
async function loadWeapon(file){const gltf=await loadLocal(file);weaponSource=gltf.scene;weaponSource.name='Weapon_Source';setShadows(weaponSource);attachWeapons();status.textContent=`Қару дайын: ${file.name}. FPP және TPP екеуіне байланыстырылды.`}
document.querySelector('#fppBtn').onclick=()=>setMode('FPP');document.querySelector('#tppBtn').onclick=()=>setMode('TPP');
document.querySelector('#tppFile').onchange=e=>e.target.files[0]&&loadTPP(e.target.files[0]).catch(err=>{console.error(err);status.textContent='TPP модель ашылмады'});
document.querySelector('#fppFile').onchange=e=>e.target.files[0]&&loadFPP(e.target.files[0]).catch(err=>{console.error(err);status.textContent='FPP модель ашылмады'});
document.querySelector('#weaponFile').onchange=e=>e.target.files[0]&&loadWeapon(e.target.files[0]).catch(err=>{console.error(err);status.textContent='Қару моделі ашылмады'});
async function tryExisting(){try{txt.textContent='Бар карта тексерілуде…';const mg=await loader.loadAsync('./assets/sendstone_new.glb');map=mg.scene;setShadows(map);scene.remove(ground);scene.add(map)}catch(e){console.warn('Existing map not found; preview ground is used',e)}try{txt.textContent='Бар кейіпкер тексерілуде…';const pg=await loader.loadAsync('./assets/sas__cs2_agent_model_blue.glb');tpp=pg.scene;tpp.name='TPP_Player';setShadows(tpp);autoScale(tpp,1.8);centerOnGround(tpp);scene.add(tpp);frame(tpp)}catch(e){console.warn('Existing TPP model not found',e);camera.position.set(2,1.5,3);controls.target.set(0,.9,0);controls.update()}loading.classList.add('hide');setMode('TPP')}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{if(controls.enabled)controls.update();renderer.render(scene,camera)});tryExisting();
</script>
</body>
</html>
