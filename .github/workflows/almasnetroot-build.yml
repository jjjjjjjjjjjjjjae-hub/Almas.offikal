name: Build AlmasNetRoot APK

on:
  push:
    branches:
      - almasnetroot-build-v02
    paths:
      - 'AlmasNetRoot/**'
      - '.github/workflows/almasnetroot-build.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'AlmasNetRoot/**'
      - '.github/workflows/almasnetroot-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build debug APK
        working-directory: AlmasNetRoot
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlmasNetRoot-v0.2-debug
          path: AlmasNetRoot/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
