name: Build AlmasFox APK

on:
  push:
    branches:
      - almasfox-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: almasfox-apk
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output
          cp almasfox-apk/app/build/outputs/apk/debug/app-debug.apk output/AlmasFox-v0.3.apk
          sha256sum output/AlmasFox-v0.3.apk > output/AlmasFox-v0.3.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlmasFox-v0.3
          path: output/*
          retention-days: 30
