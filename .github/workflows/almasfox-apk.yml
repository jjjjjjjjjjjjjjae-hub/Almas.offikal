name: Build AlmasFox v0.4

on:
  push:
    branches:
      - almasfox-apk
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android 35 SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: almasfox-apk
        run: gradle --no-daemon assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p output-android
          cp almasfox-apk/app/build/outputs/apk/debug/app-debug.apk output-android/AlmasFox-v0.4.apk
          sha256sum output-android/AlmasFox-v0.4.apk > output-android/AlmasFox-v0.4.apk.sha256

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AlmasFox-v0.4-Android
          path: output-android/*
          retention-days: 30

  windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish AlmasFox PC
        shell: pwsh
        run: |
          dotnet publish almasfox-pc/AlmasFoxPC.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:DebugType=None -p:DebugSymbols=false -o output-pc
          Get-FileHash output-pc/AlmasFoxPC.exe -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  AlmasFoxPC.exe" } | Set-Content output-pc/AlmasFoxPC.exe.sha256

      - name: Upload PC app
        uses: actions/upload-artifact@v4
        with:
          name: AlmasFox-PC-v0.4-Windows
          path: |
            output-pc/AlmasFoxPC.exe
            output-pc/AlmasFoxPC.exe.sha256
          retention-days: 30
