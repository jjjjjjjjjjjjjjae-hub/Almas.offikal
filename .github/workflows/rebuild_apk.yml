name: Deep Binary Patch and Rebuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget python3
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Decompile APK
      run: |
        java -jar apktool.jar d -r mod_app.apk -o app_source

    - name: Deep Binary Patching with Python
      run: |
        python3 -c '
        import os
        
        # Ескі мәліметтер (Түпнұсқа сілтеме мен хэш)
        old_str = "t.me/+DBlkZ2lwQbRiNJM1"  # 21 таңба
        old_hash = "DBlkZ2lwQbRiNJM1"       # 16 таңба
        
        # Жаңа мәліметтер (Ұзындығы ескісімен бірдей болуы БҰЛЖЫТПАС ТАЛАП!)
        new_str = "t.me/AlmasOfficial123"  # 21 таңба
        new_hash = "AlmasOfficial123"       # 16 таңба
        
        print("Байт деңгейінде іздеу және ауыстыру басталды...")
        
        for root, dirs, files in os.walk("app_source"):
            for file in files:
                filepath = os.path.join(root, file)
                try:
                    with open(filepath, "rb") as f:
                        data = f.read()
                    
                    replaced = False
                    
                    # 1. UTF-8 / ASCII форматтарын тексеру
                    if old_str.encode("utf-8") in data:
                        data = data.replace(old_str.encode("utf-8"), new_str.encode("utf-8"))
                        replaced = True
                    if old_hash.encode("utf-8") in data:
                        data = data.replace(old_hash.encode("utf-8"), new_hash.encode("utf-8"))
                        replaced = True
                        
                    # 2. UTF-16 LE (Ресурстар кестесіндегі жасырын мәтіндер) форматтарын тексеру
                    if old_str.encode("utf-16le") in data:
                        data = data.replace(old_str.encode("utf-16le"), new_str.encode("utf-16le"))
                        replaced = True
                    if old_hash.encode("utf-16le") in data:
                        data = data.replace(old_hash.encode("utf-16le"), new_hash.encode("utf-16le"))
                        replaced = True
                        
                    if replaced:
                        with open(filepath, "wb") as f:
                            f.write(data)
                        print(f"✅ Патч сәтті қолданылды: {filepath}")
                except Exception as e:
                    pass
        '

    - name: Recompile APK
      run: |
        java -jar apktool.jar b app_source -o patched_unsigned.apk

    - name: Sign APK
      run: |
        java -jar uber-apk-signer.jar --apks patched_unsigned.apk --out output/

    - name: Upload Patched APK
      uses: actions/upload-artifact@v4
      with:
        name: No-Redirect-APK
        path: output/*.apk
