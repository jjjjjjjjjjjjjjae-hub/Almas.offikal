name: Remove Telegram Redirect and Rebuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Decompile APK (Skipping Resources)
      run: |
        # Бұл жерге -r флагы қосылды, ол қорғанысты айналып өтеді
        java -jar apktool.jar d -r mod_app.apk -o app_source

    - name: Find and Replace Telegram Link
      run: |
        echo "Сілтемелерді код ішінен іздеу басталды..."
        OLD_LINK="t.me/+DBlkZ2lwQbRiNJM1"
        NEW_LINK="t.me/Almas_Official" 
        
        find app_source/ -type f -exec sed -i "s|$OLD_LINK|$NEW_LINK|g" {} +
        find app_source/ -type f -exec sed -i "s|DBlkZ2lwQbRiNJM1|Almas_Mod_Menu|g" {} +
        echo "Сілтемелер сәтті ауыстырылды!"

    - name: Recompile APK
      run: |
        java -jar apktool.jar b app_source -o patched_unsigned.apk

    - name: Sign APK
      run: |
        java -jar uber-apk-signer.jar --apks patched_unsigned.apk --out output/

    - name: Upload Patched APK
      uses: actions/upload-artifact@v4
      with:
        name: No-Redirect-APK
        path: output/*.apk
