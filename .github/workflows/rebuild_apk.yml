name: Logic Patch (Block startActivity) and Rebuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget python3
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Decompile APK
      run: |
        java -jar apktool.jar d -r mod_app.apk -o app_source

    - name: Smali Logic Patching (Inject NOP)
      run: |
        python3 -c '
        import os
        import re

        print("Smali кодтарына логикалық патч жасау басталды...")
        
        # Репозиторийдегі бүкіл файлдарды тінтиміз
        for root, dirs, files in os.walk("app_source"):
            for file in files:
                if file.endswith(".smali"):
                    filepath = os.path.join(root, file)
                    
                    try:
                        with open(filepath, "r", encoding="utf-8", errors="ignore") as f:
                            content = f.read()
                        
                        # Егер файл ішінде ескі Telegram сілтемесінің хэші немесе бағыттау белгісі болса
                        if "DBlkZ2lwQbRiNJM1" in content or "t.me" in content:
                            print(f"🎯 Нысана табылды: {filepath}")
                            
                            # startActivity командаларын іздеп, оларды "nop" (ештеңе істемеу) бұйрығына ауыстырамыз
                            # Бұл команда браузердің немесе Telegram-ның ашылуын түпкілікті бұғаттайды
                            patched_content = re.sub(
                                r"invoke-virtual \{.*\}, Landroid/.*->startActivity\(Landroid/content/Intent;\)V",
                                "nop",
                                content
                            )
                            patched_content = re.sub(
                                r"invoke-static \{.*\}, Landroid/.*->startActivity\(.*\)",
                                "nop",
                                patched_content
                            )
                            
                            with open(filepath, "w", encoding="utf-8") as f:
                                f.write(patched_content)
                            print("🛠 СӘТТІ: startActivity командасы БҰҒАТТАЛДЫ (nop қойылды).")
                    except Exception as e:
                        print(f"Қате файл оқуда: {e}")
        '

    - name: Recompile APK
      run: |
        java -jar apktool.jar b app_source -o patched_unsigned.apk

    - name: Sign APK
      run: |
        java -jar uber-apk-signer.jar --apks patched_unsigned.apk --out output/

    - name: Upload Patched APK
      uses: actions/upload-artifact@v4
      with:
        name: No-Redirect-APK
        path: output/*.apk
