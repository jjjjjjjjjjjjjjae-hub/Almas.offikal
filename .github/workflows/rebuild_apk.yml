name: Block Pastebin Cloud Redirect and Rebuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget
        wget https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar -O apktool.jar
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Decompile APK
      run: |
        java -jar apktool.jar d -r mod_app.apk -o app_source

    - name: Block Cloud Redirect
      run: |
        echo "Pastebin бұлттық сілтемесін бұғаттау басталды..."
        CLOUD_URL="https://pastebin.com/raw/c9jJGrAahypotii0"
        
        # 127.0.0.1 бұл телефонның өзі (localhost). Ол жерде ешқандай сайт жоқ, 
        # сондықтан байланыс бірден үзіліп, қолданба ештеңе аша алмай қалады.
        FAKE_URL="http://127.0.0.1/blocked_by_almas"

        # Барлық Smali кодтарынан Pastebin сілтемесін тауып, жалған сілтемеге ауыстырамыз
        find app_source/ -type f -name "*.smali" -exec sed -i "s|$CLOUD_URL|$FAKE_URL|g" {} +
        echo "Сілтеме сәтті бұғатталды!"

    - name: Recompile APK
      run: |
        java -jar apktool.jar b app_source -o patched_unsigned.apk

    - name: Sign APK
      run: |
        java -jar uber-apk-signer.jar --apks patched_unsigned.apk --out output/

    - name: Upload Patched APK
      uses: actions/upload-artifact@v4
      with:
        name: No-Cloud-Redirect-APK
        path: output/*.apk
