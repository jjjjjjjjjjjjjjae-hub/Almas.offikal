name: Build ALMAS Bridge APK

on:
  push:
    branches: [ "main" ]
    paths:
      - "bridge-app/**"
      - ".github/workflows/rebuild_apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Build debug APK
        working-directory: bridge-app
        run: gradle --no-daemon assembleDebug

      - name: Copy release file
        run: cp bridge-app/app/build/outputs/apk/debug/app-debug.apk ALMAS-OFFICAL-BRIDGE-v0.6.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ALMAS-OFFICAL-BRIDGE-v0.6
          path: ALMAS-OFFICAL-BRIDGE-v0.6.apk

      - name: Publish latest APK to repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ALMAS-OFFICAL-BRIDGE-v0.6.apk
          if git diff --cached --quiet; then
            echo "APK unchanged"
          else
            git commit -m "Build ALMAS OFFICAL bridge APK v0.6"
            git push
          fi
