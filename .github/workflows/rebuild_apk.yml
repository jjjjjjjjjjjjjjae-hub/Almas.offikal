name: Pure Binary Dex Patch and Rebuild

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  patch_and_build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Install Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y wget zip unzip python3
        wget https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -O uber-apk-signer.jar

    - name: Extract APK
      run: |
        unzip -q mod_app.apk -d apk_extracted

    - name: Binary Patch classes.dex and Fix Checksums
      run: |
        python3 -c '
        import os
        import hashlib
        import zlib
        import struct

        # Біз іздейтін түпнұсқа сілтеме (нақты 43 байт)
        old_bytes = b"https://pastebin.com/raw/c9jJGrAahypotii0"
        # Біз ауыстыратын жалған сілтеме (бұл да нақты 43 байт)
        new_bytes = b"http://127.0.0.1/12345678901234567890123456"

        def patch_dex(file_path):
            with open(file_path, "rb") as f:
                data = bytearray(f.read())
            
            if old_bytes in data:
                print(f"🎯 Нысана табылды, патчталуда: {file_path}")
                
                # Байттарды тікелей офсет бойынша ауыстыру
                data = data.replace(old_bytes, new_bytes)
                
                # ТҮЗЕТУ (DEX Header Fix): Бинарлық файл бұзылып қалмауы үшін хэштерді қайта есептейміз
                # 1. SHA-1 Signature қайта есептеу (32-ші байттан бастап соңына дейін)
                sha1 = hashlib.sha1()
                sha1.update(data[32:])
                data[12:32] = sha1.digest()
                
                # 2. Adler32 Checksum қайта есептеу (12-ші байттан бастап соңына дейін)
                adler = zlib.adler32(data[12:]) & 0xffffffff
                data[8:12] = struct.pack("<I", adler)
                
                with open(file_path, "wb") as f:
                    f.write(data)
                print(f"✅ {file_path} сәтті патчталды және чексумдары түзетілді!")
            else:
                pass

        # APK ішіндегі барлық .dex файлдарды (classes.dex, classes2.dex т.б.) аралап шығамыз
        for root, dirs, files in os.walk("apk_extracted"):
            for file in files:
                if file.endswith(".dex"):
                    patch_dex(os.path.join(root, file))
        '

    - name: Repack APK
      run: |
        cd apk_extracted
        zip -r ../patched_unsigned.apk .
        cd ..

    - name: Sign APK
      run: |
        java -jar uber-apk-signer.jar --apks patched_unsigned.apk --out output/

    - name: Upload Patched APK
      uses: actions/upload-artifact@v4
      with:
        name: Pure-Binary-Patched-APK
        path: output/*.apk
