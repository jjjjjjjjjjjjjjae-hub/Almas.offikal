name: Build AlmasNet Root APK

on:
  push:
    branches:
      - almasnet-root-build-20260928
    paths:
      - 'almasnet_root_source.b64'
      - '.github/workflows/almasnet-root-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode source
        run: |
          base64 -d almasnet_root_source.b64 > /tmp/AlmasNetRoot_SOURCE.zip
          rm -rf /tmp/almasnet-root-build
          mkdir -p /tmp/almasnet-root-build
          unzip -q /tmp/AlmasNetRoot_SOURCE.zip -d /tmp/almasnet-root-build

      - name: Build debug APK
        working-directory: /tmp/almasnet-root-build/AlmasNetRoot
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Copy APK
        run: cp /tmp/almasnet-root-build/AlmasNetRoot/app/build/outputs/apk/debug/app-debug.apk ./AlmasNetRoot-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: AlmasNetRoot-debug
          path: AlmasNetRoot-debug.apk
          if-no-files-found: error
